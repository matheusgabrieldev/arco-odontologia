<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arco Odontologia</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--fundo-pagina); color:var(--texto); font-family:var(--font-texto); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .salvia { fill:var(--marca); }
  .menta { fill:var(--marca-suave); }
  .ambar { fill:var(--destaque); }
  .tinta { fill:var(--texto); }
  .blk { rx:var(--raio-lg); }
  .disco { rx:28px; }
  .arc { fill:none; stroke:var(--marca-suave); stroke-width:6; stroke-linecap:round; }
  .arc-ext { fill:none; stroke:var(--marca-suave); stroke-width:16; stroke-linecap:round; }
  .arc-int { fill:none; stroke:var(--destaque); stroke-width:11; stroke-linecap:round; }
  .words { position:absolute; left:var(--espaco-6); bottom:var(--espaco-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:64px; line-height:.95; font-weight:400; letter-spacing:-.035em; color:var(--texto); }
  .name span { color:var(--texto-suave); }
  .tag { margin:var(--espaco-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--texto-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      texto (grafite) 144×264 bleeding off the bottom · marca (sálvia) 208×260 bleeding off the top, the biggest · marca-suave (menta) 112×192 bleeding off the right · destaque (âmbar) one 56px disc, the only small one (5% of the brand) — about 38% of 960×288
  arrangement one tall sálvia slab with satellites, staggered: ink low-left, menta low-right, the âmbar disc above it like the inner arc of the mark
  pattern     arcs, from "Todo sorriso tem um desenho" and the arco dental motif: nine U-arcs at a 60px pitch cut into the sálvia slab in menta, and the mark's own two arcs drawn large on the ink block
  scales      gutters espaco-4 (16); pitch 60 ≈ espaco-8 − espaco-1; corners raio-lg (28); disc rx half of 56
-->

</div>
<div class="words">

</div>
</div>

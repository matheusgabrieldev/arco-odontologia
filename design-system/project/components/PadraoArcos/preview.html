<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>PadraoArcos</title></head>
<body>
<div style="background:var(--marca);border-radius:var(--raio-lg);overflow:hidden;margin:var(--margem-placa)"><canvas id="p" style="width:100%;height:168px;display:block" aria-hidden="true"></canvas></div>
<script>document.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener("click",function(e){e.preventDefault()})});</script><script>
(function(){var cv=document.getElementById("p");var a=getComputedStyle(document.documentElement).getPropertyValue("--destaque").trim()||"#E3A03A";
function d(){var w=cv.clientWidth,h=cv.clientHeight,r=window.devicePixelRatio||1;cv.width=w*r;cv.height=h*r;var g=cv.getContext("2d");g.scale(r,r);g.lineCap="round";g.lineWidth=3;var s=56;
for(var y=-10,row=0;y<h+s;y+=s*.62,row++){for(var x=(row%2?s/2:0)-s;x<w+s;x+=s){g.strokeStyle=(row*7+Math.round(x/s))%11===0?a:"rgba(207,232,223,.4)";g.beginPath();g.moveTo(x+6,y);g.bezierCurveTo(x+6,y+26,x+16,y+34,x+s/2,y+34);g.bezierCurveTo(x+s-16,y+34,x+s-6,y+26,x+s-6,y);g.stroke();}}}
d();addEventListener("resize",d);})();
</script>
</body></html>
